services:
  onchain-snapshot-api:
    build: .
    image: umbrel-onchain-snapshot-api:latest
    container_name: onchain-snapshot-api
    restart: unless-stopped
    ports:
      # Bound to all interfaces so other containers (e.g. the caddy service
      # below) and the LAN can reach this directly for debugging. Not
      # forwarded through the router - only 8080/8443 (caddy) are.
      - "4021:4021"
    # Populated from Portainer's stack-level "Environment variables" UI at
    # deploy time (Repository build method substitutes ${VAR} references
    # here) - no .env file is committed to this repo or needed on the host.
    # IMPORTANT: setting a value in Portainer's UI alone does NOT get it into
    # the container -- it only fills in ${VAR} references that exist below.
    # Every env var the app actually reads (see dataSources.js /
    # x402Middleware.js) must have a line here too, or it silently never
    # reaches the process no matter what Portainer shows.
    environment:
      PAY_TO_ADDRESS: ${PAY_TO_ADDRESS}
      CDP_API_KEY_ID: ${CDP_API_KEY_ID}
      CDP_API_KEY_SECRET: ${CDP_API_KEY_SECRET}
      X402_FACILITATOR_URL: ${X402_FACILITATOR_URL}
      ETH_RPC_URL: ${ETH_RPC_URL}
      # Points at the local caching proxy below, NOT the real Solana RPC
      # directly. See sol-rpc-cache.mjs for why: @x402/svm 2.20.0 refetches
      # a brand new blockhash on every single request (including the internal
      # re-check of a client's payment retry), and @x402/core's matching
      # logic requires that blockhash to match exactly - so without this
      # cache, real payments fail almost every time with "No matching
      # payment requirements", even with a fully funded wallet.
      SOL_RPC_URL: http://sol-rpc-cache:3000
      PORT: ${PORT}
      # Optional -- dataSources.js falls back to the public Pocketdex
      # endpoint (https://data.pocket.network/graphql) if unset. Only set
      # this in Portainer if you're pointing at a different POKT indexer.
      POKT_GRAPHQL_URL: ${POKT_GRAPHQL_URL}
      # Required for GET /v1/uprock/fetch -- sign up free at
      # https://uprock.ai and set this in Portainer's stack env vars. Without
      # it, that one route fails with "UPROCK_API_KEY is not set" but every
      # other route is unaffected.
      UPROCK_API_KEY: ${UPROCK_API_KEY}
      # peaq (EVM, chain ID 3338) support -- all three optional/graceful:
      # PEAQ_PAY_TO_ADDRESS is the peaq EVM wallet address payments settle
      # to (a *different* wallet than PAY_TO_ADDRESS, which is Solana-only).
      # Until this is set, every route just lists Solana payment only --
      # nothing breaks. PEAQ_RPC_URL defaults to a free public peaq RPC if
      # unset. PAYAI_FACILITATOR_URL defaults to PayAI's public hosted
      # facilitator (peaq's officially documented x402 facilitator) if unset.
      PEAQ_PAY_TO_ADDRESS: ${PEAQ_PAY_TO_ADDRESS}
      PEAQ_RPC_URL: ${PEAQ_RPC_URL}
      PAYAI_FACILITATOR_URL: ${PAYAI_FACILITATOR_URL}
    depends_on:
      - sol-rpc-cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4021/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  sol-rpc-cache:
    # Caching reverse-proxy in front of the real Solana RPC endpoint. Only
    # exists to work around a race condition in @x402/svm 2.20.0 - see
    # sol-rpc-cache.mjs for the full explanation. Not reachable from outside
    # the docker network; no ports are published to the host.
    build:
      context: .
      dockerfile: sol-rpc-cache.Dockerfile
    image: umbrel-onchain-snapshot-sol-rpc-cache:latest
    container_name: onchain-snapshot-sol-rpc-cache
    restart: unless-stopped
    environment:
      # Reuses the same Portainer stack variable the api service used to
      # point straight at - no new variable needs to be added in Portainer.
      UPSTREAM_RPC_URL: ${SOL_RPC_URL}
      PORT: "3000"

  caddy:
    # Terminates TLS and reverse-proxies to onchain-snapshot-api over the
    # docker-internal network. Published on 8080/8443 instead of the
    # standard 80/443 because Umbrel's own dashboard already owns host
    # ports 80/443, and Umbrel's official Nginx Proxy Manager app is fixed
    # to host ports 40080/40443 - which happens to fall inside a port range
    # this ISP's router blocks for forwarding. 8080/8443 avoid both
    # conflicts. The router forwards external 80->8080 and 443->8443; Caddy
    # itself is unaware of this remap and requests/renews Let's Encrypt
    # certs normally since, from the ACME CA's perspective, it's still
    # talking to ports 80/443 on the public IP.
    build:
      context: .
      dockerfile: caddy.Dockerfile
    image: umbrel-onchain-snapshot-caddy:latest
    container_name: onchain-snapshot-caddy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - onchain-snapshot-api

volumes:
  caddy_data:
  caddy_config:
