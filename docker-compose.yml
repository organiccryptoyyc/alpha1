services:
  onchain-snapshot-api:
    build: .
    image: umbrel-onchain-snapshot-api:latest
    container_name: onchain-snapshot-api
    restart: unless-stopped
    ports:
      # Bound to all interfaces so other containers (e.g. the caddy service
      # below) and the LAN can reach this directly for debugging. Not
      # forwarded through the router - only 8080/8443 (caddy) are.
      - "4021:4021"
    # Populated from Portainer's stack-level "Environment variables" UI at
    # deploy time (Repository build method substitutes ${VAR} references
    # here) - no .env file is committed to this repo or needed on the host.
    # IMPORTANT: setting a value in Portainer's UI alone does NOT get it into
    # the container -- it only fills in ${VAR} references that exist below.
    # Every env var the app actually reads (see dataSources.js /
    # x402Middleware.js) must have a line here too, or it silently never
    # reaches the process no matter what Portainer shows.
    environment:
      PAY_TO_ADDRESS: ${PAY_TO_ADDRESS}
      CDP_API_KEY_ID: ${CDP_API_KEY_ID}
      CDP_API_KEY_SECRET: ${CDP_API_KEY_SECRET}
      X402_FACILITATOR_URL: ${X402_FACILITATOR_URL}
      ETH_RPC_URL: ${ETH_RPC_URL}
      # Points at the local caching proxy below, NOT the real Solana RPC
      # directly. See sol-rpc-cache.mjs for why: @x402/svm 2.20.0 refetches
      # a brand new blockhash on every single request (including the internal
      # re-check of a client's payment retry), and @x402/core's matching
      # logic requires that blockhash to match exactly - so without this
      # cache, real payments fail almost every time with "No matching
      # payment requirements", even with a fully funded wallet.
      SOL_RPC_URL: http://sol-rpc-cache:3000
      PORT: ${PORT}
      # Optional -- dataSources.js falls back to the public Pocketdex
      # endpoint (https://data.pocket.network/graphql) if unset. Only set
      # this in Portainer if you're pointing at a different POKT indexer.
      POKT_GRAPHQL_URL: ${POKT_GRAPHQL_URL}
      # Required for GET /v1/uprock/fetch -- sign up free at
      # https://uprock.ai and set this in Portainer's stack env vars. Without
      # it, that one route fails with "UPROCK_API_KEY is not set" but every
      # other route is unaffected.
      UPROCK_API_KEY: ${UPROCK_API_KEY}
      # peaq (EVM, chain ID 3338) support -- all three optional/graceful:
      # PEAQ_PAY_TO_ADDRESS is the peaq EVM wallet address payments settle
      # to (a *different* wallet than PAY_TO_ADDRESS, which is Solana-only).
      # Until this is set, every route just lists Solana payment only --
      # nothing breaks. PEAQ_RPC_URL defaults to a free public peaq RPC if
      # unset. PAYAI_FACILITATOR_URL defaults to PayAI's public hosted
      # facilitator (peaq's officially documented x402 facilitator) if unset.
      PEAQ_PAY_TO_ADDRESS: ${PEAQ_PAY_TO_ADDRESS}
      PEAQ_RPC_URL: ${PEAQ_RPC_URL}
      # Self-hosted facilitator (see peaq-facilitator.js) -- replaces PayAI,
      # which never actually advertised eip155:3338 support despite peaq's
      # docs. Internal-only, reached by service name over the docker
      # network; not published to the host or the internet. Optional, same
      # as PEAQ_RPC_URL above -- x402Middleware.js defaults it to
      # http://peaq-facilitator:3333 (the service below) in code, so this
      # only needs setting in Portainer if you point it somewhere else.
      PEAQ_FACILITATOR_URL: ${PEAQ_FACILITATOR_URL}
      # BNB Smart Chain (BSC, chain ID 56) data layer -- optional, same
      # graceful-default pattern as ETH_RPC_URL/PEAQ_RPC_URL above. Powers
      # GET /v1/bsc/gas-price, /v1/bsc/latest-block, and the 'bsc' option on
      # /v1/wallet/balance/:chain/:address regardless of BSC's payment-network
      # status below. Also reused by GET /v1/agent/reputation/:agentId
      # (?chain=bsc) below -- ERC-8004's registries are deployed at the same
      # address on BSC as on Ethereum, so no separate RPC var was needed for
      # that route.
      BSC_RPC_URL: ${BSC_RPC_URL}
      # BSC as a PAYMENT network is scaffolded but NOT yet active -- see the
      # BSC scaffolding note at the top of x402Middleware.js. Setting this
      # alone does nothing yet: Binance's hosted facilitator (B402) requires
      # a partner application (business details, this wallet address, an
      # RSA keypair, an IP whitelist) plus RSA-SHA256 request signing that
      # hasn't been implemented in buildBinanceFacilitatorConfig() yet. Left
      # here so the one remaining step, once that client is written and
      # partner credentials exist, is setting this value and redeploying --
      # no further code changes needed.
      BSC_PAY_TO_ADDRESS: ${BSC_PAY_TO_ADDRESS}
      # PATCH (UpRock Verify -- GET /v1/uprock/verify/:domain): a SEPARATE
      # UpRock API key from UPROCK_API_KEY above, on request -- separate
      # UpRock accounts/keys per service line let you see exactly which
      # product line is driving UpRock credit spend from UpRock's own
      # dashboard, without digging through this app's logs. Falls back to
      # UPROCK_API_KEY in code if left unset, so this route doesn't hard-fail
      # just because a second key hasn't been minted yet -- same
      # graceful-degrade pattern as everything else here.
      UPROCK_VERIFY_API_KEY: ${UPROCK_VERIFY_API_KEY}
      # PATCH (participant allowlist -- see allowlist.js for the full
      # design). "off" (or unset) by default -- every metered route behaves
      # exactly as before. Set to "log" first to see who's calling without
      # blocking anyone, then "enforce" once ALLOWLIST_KEYS is populated.
      # ALLOWLIST_KEYS is a comma-separated list of accepted values for the
      # X-Alpha7-Key request header. NOTE: if you set ALLOWLIST_MODE=enforce
      # without setting ALLOWLIST_KEYS, every metered request gets rejected
      # -- that's fail-closed by design, not a bug, see allowlist.js.
      ALLOWLIST_MODE: ${ALLOWLIST_MODE}
      ALLOWLIST_KEYS: ${ALLOWLIST_KEYS}
      # PATCH (2026-08-15): headless-Chrome render service backing
      # GET /v1/render/screenshot -- see puppeteer-render.js for the full
      # "why a separate container" rationale. Internal-only, reached by
      # service name over the docker network; not published to the host or
      # the internet. Optional in the same graceful-default sense as
      # PEAQ_FACILITATOR_URL above -- x402Middleware.js/dataSources.js
      # default it to http://puppeteer-render:3002 (the service below) in
      # code, so this only needs setting in Portainer if you point it
      # somewhere else.
      PUPPETEER_RENDER_URL: ${PUPPETEER_RENDER_URL}
      # PATCH (2026-08-16): self-hosted metasearch service backing
      # GET /v1/search/web -- see the searxng service below and
      # getWebSearch() in dataSources.js. Same optional/graceful-default
      # pattern as PUPPETEER_RENDER_URL above -- defaults to
      # http://searxng:8080 in code, only needs setting here if pointed
      # somewhere else.
      SEARXNG_URL: ${SEARXNG_URL}
    depends_on:
      - sol-rpc-cache
      - puppeteer-render
      - searxng
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4021/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  sol-rpc-cache:
    # Caching reverse-proxy in front of the real Solana RPC endpoint. Only
    # exists to work around a race condition in @x402/svm 2.20.0 - see
    # sol-rpc-cache.mjs for the full explanation. Not reachable from outside
    # the docker network; no ports are published to the host.
    build:
      context: .
      dockerfile: sol-rpc-cache.Dockerfile
    image: umbrel-onchain-snapshot-sol-rpc-cache:latest
    container_name: onchain-snapshot-sol-rpc-cache
    restart: unless-stopped
    environment:
      # Reuses the same Portainer stack variable the api service used to
      # point straight at - no new variable needs to be added in Portainer.
      UPSTREAM_RPC_URL: ${SOL_RPC_URL}
      PORT: "3000"

  peaq-facilitator:
    # Self-hosted x402 v2 facilitator for peaq (chain ID 3338) -- see
    # peaq-facilitator.js for the full "why" (short version: neither CDP nor
    # PayAI support this network). Internal-only, same pattern as
    # sol-rpc-cache below: no ports published to the host, reachable from
    # onchain-snapshot-api only by its service name over the docker network.
    # Boots fine with no FACILITATOR_PRIVATE_KEY set (idles with an empty
    # supported list instead of crash-looping) -- safe to deploy this
    # service before a funded wallet exists, then activate it later by
    # setting FACILITATOR_PRIVATE_KEY in Portainer and redeploying.
    build:
      context: .
      dockerfile: peaq-facilitator.Dockerfile
    image: umbrel-onchain-snapshot-peaq-facilitator:latest
    container_name: onchain-snapshot-peaq-facilitator
    restart: unless-stopped
    environment:
      # The wallet that SUBMITS settlement transactions and pays their gas
      # on peaq -- separate from PEAQ_PAY_TO_ADDRESS above, which only
      # RECEIVES payments and never signs anything. Leave unset until you
      # have a dedicated peaq wallet funded with a small amount of native
      # PEAQ for gas; this service runs fine either way.
      FACILITATOR_PRIVATE_KEY: ${FACILITATOR_PRIVATE_KEY}
      # Reuses the same Portainer stack variable the api service reads --
      # no separate variable needed for this service.
      PEAQ_RPC_URL: ${PEAQ_RPC_URL}
      PORT: "3333"

  puppeteer-render:
    # Internal-only headless-Chrome rendering service backing
    # GET /v1/render/screenshot -- see puppeteer-render.js for the full
    # "why a separate container" rationale (Chrome's resource footprint is a
    # different order of magnitude than every other route's lightweight
    # JSON pass-through, so it's isolated here rather than bundled into the
    # main app image/process). No ports published to the host; reachable
    # from onchain-snapshot-api only by its service name over the docker
    # network, same isolation pattern as sol-rpc-cache and peaq-facilitator
    # above. Builds its own Alpine + system-chromium image (see
    # puppeteer-render.Dockerfile) -- expect a noticeably longer first build
    # than this repo's other services, since apk installing chromium plus
    # npm installing puppeteer-core is more work than either sol-rpc-cache
    # (zero deps) or peaq-facilitator (three small deps).
    build:
      context: .
      dockerfile: puppeteer-render.Dockerfile
    image: umbrel-onchain-snapshot-puppeteer-render:latest
    container_name: onchain-snapshot-puppeteer-render
    restart: unless-stopped
    environment:
      PORT: "3002"

  searxng:
    # Internal-only self-hosted metasearch aggregator backing
    # GET /v1/search/web -- see getWebSearch() in dataSources.js. Unlike
    # puppeteer-render/peaq-facilitator/sol-rpc-cache above, this uses the
    # official upstream image directly rather than a custom Dockerfile --
    # SearXNG ships as a ready-made Docker image with its own Python/uwsgi
    # runtime, there's nothing of this project's own to build or npm-install
    # into it. No ports published to the host; reachable from
    # onchain-snapshot-api only by its service name over the docker network,
    # same isolation pattern as every other internal service in this file.
    # searxng-settings.yml (mounted read-only below) turns on JSON output
    # format and disables SearXNG's own rate limiter -- both off by default
    # upstream (aimed at public-facing deployments), neither needed here
    # since the only caller is this project's own container on the internal
    # docker network, not the public internet.
    image: searxng/searxng:latest
    container_name: onchain-snapshot-searxng
    restart: unless-stopped
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/

  caddy:
    # Terminates TLS and reverse-proxies to onchain-snapshot-api over the
    # docker-internal network. Published on 8080/8443 instead of the
    # standard 80/443 because Umbrel's own dashboard already owns host
    # ports 80/443, and Umbrel's official Nginx Proxy Manager app is fixed
    # to host ports 40080/40443 - which happens to fall inside a port range
    # this ISP's router blocks for forwarding. 8080/8443 avoid both
    # conflicts. The router forwards external 80->8080 and 443->8443; Caddy
    # itself is unaware of this remap and requests/renews Let's Encrypt
    # certs normally since, from the ACME CA's perspective, it's still
    # talking to ports 80/443 on the public IP.
    build:
      context: .
      dockerfile: caddy.Dockerfile
    image: umbrel-onchain-snapshot-caddy:latest
    container_name: onchain-snapshot-caddy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - onchain-snapshot-api

volumes:
  caddy_data:
  caddy_config:
